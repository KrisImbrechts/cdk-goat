---

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: f71fa2c1f9cf5cb705f73dffe4b21f7c61470ba9  # frozen: v4.1.0
    hooks:
      - id: trailing-whitespace
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml

  - repo: https://github.com/pycqa/flake8
    rev: 479b1304f72e6a3b7c05ed305ac78e888e82e0b1  # frozen: 4.0.1
    hooks:
      - id: flake8
        additional_dependencies: [
          'flake8-blind-except',
          'flake8-bugbear',
          'flake8-comprehensions',
          'flake8-implicit-str-concat',
        ]

  - repo: https://github.com/asottile/seed-isort-config
    rev: 0f4393f44ace1e7f767b0b3c6b6f5e5e5e5e5e5e  # frozen: v2.2.0
    hooks:
      - id: seed-isort-config

  - repo: https://github.com/PyCQA/isort
    rev: 12cc5fbd67eebf92eb2213b03c07b138ae1fb448  # frozen: 5.11.5
    hooks:
      - id: isort
        pass_filenames: true
        args: ["--profile", "black"]

  - repo: https://github.com/psf/black
    rev: d9e71863c8c6108e6f1c5e5e5e5e5e5e5e5e5e5e  # frozen: 22.6.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # frozen: v1.9.0
    hooks:
      - id: python-use-type-annotations
      - id: python-no-eval
